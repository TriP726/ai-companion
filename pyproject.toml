[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ai-companion"
version = "0.1.0"
description = "Local-first Windows desktop AI companion"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "pydantic>=2.0",
    "llama-cpp-python>=0.2.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "networkx>=3.1",
    "pyspellchecker>=0.8.0",
    # Speech. Both are CPU-only and fully offline once models are downloaded.
    "faster-whisper>=1.0.0",
    "piper-tts>=1.2.0",
    "sounddevice>=0.4.6",
    # Voice post-processing (EQ, reverb, limiter).
    "scipy>=1.10",
    # Optional higher-quality TTS engine.
    "kokoro-onnx>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
ai-companion = "ai_companion.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
